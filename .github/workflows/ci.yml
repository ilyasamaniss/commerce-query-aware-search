name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  offline-benchmark:
    # Baseline BM25 smoke benchmark against the bundled sample catalog (no API keys, no Ollama).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run smoke benchmark
        run: |
          python scripts/run_search_benchmark.py \
            --tasks benchmarks/tasks/smoke.jsonl \
            --retriever bm25 \
            --catalog benchmarks/catalog/sample_catalog.json \
            --out artifacts/smoke/retriever=bm25__analyzer=none/predictions.jsonl
      - name: Score smoke benchmark
        run: |
          python scripts/score_benchmark.py \
            --results artifacts/smoke/retriever=bm25__analyzer=none/predictions.jsonl \
            --metrics-out artifacts/smoke/retriever=bm25__analyzer=none/metrics.json \
            --failures-out artifacts/smoke/retriever=bm25__analyzer=none/failures.jsonl \
            --catalog benchmarks/catalog/sample_catalog.json
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-benchmark
          path: artifacts/smoke/
